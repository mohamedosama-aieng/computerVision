[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hikvision-secure-viewer"
version = "0.1.0"
description = "Secure Hikvision multi-camera desktop viewer with computer-vision hooks"
requires-python = ">=3.11"
dependencies = [
  "keyring>=25.6,<26",
  "opencv-python>=4.10,<5",
  "PySide6>=6.8,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
hikvision-viewer = "hikvision_app.main:main"

[tool.setuptools.packages.find]
include = ["hikvision_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
